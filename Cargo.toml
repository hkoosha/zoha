[package]
name = "zoha"
version = "0.9.0"
edition = "2024"
authors = ["Koosha Hosseiny <git@koosha.io>"]
description = "A drop down terminal, inspired by Tilda"
homepage = "https://koosha.io/project/zoha"
license = "GPL-3.0"
readme = "README.md"
repository = "https://gitlab.com/hkoosha/zoha"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
env_logger = { version = "0.11" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"

gdk = "0.19.0"
gtk = "0.19.0"
pango = { version = "0.22.9", features = ["v1_58"] }
glib = { version = "0.22.10", features = ["v2_66"] }

vte-rs = { path = "../vte-rs/vte-rs" }
vte-sys = { path = "../vte-rs/vte-sys" }
# zoha-vte = { version = "0.6.0", features = ["v0_50"] }
# zoha-vte-sys = { version = "0.6.0", features = ["v0_50"] }

dbus = "0.9"
